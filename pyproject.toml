[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benkyoustudio"
version = "0.12.0"
description = "Aplicativo desktop para criação, organização e exportação de flashcards compatíveis com o Anki."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "PySide6>=6.11,<7",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "google-genai>=2.17,<3",
  "genanki>=0.13.1,<1",
  "Pillow>=11,<13",
  "keyring>=25.6,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
benkyoustudio = "ankiistudio.main:main"
ankiistudio = "ankiistudio.main:main"  # alias legado de compatibilidade

[tool.setuptools.packages.find]
include = ["ankiistudio*"]

[tool.setuptools.package-data]
ankiistudio = ["resources/icons/*.svg", "resources/icons/*.png", "resources/icons/*.ico", "resources/*.json", "data/*.json", "languages/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
